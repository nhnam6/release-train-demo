name: Release Deploy

# guard -> deploy -> promote for a given tag. RELEASE_PLAN.md §6.2. `deploy`
# is a stub here (no real AWS in this demo) -- guard, tag, `production` are
# real.
#
# Reusable (workflow_call) AND independently triggerable (push tags / manual
# dispatch) at once -- both are needed, not a compromise between them:
#
#   - `workflow_call`, invoked from release-please.yml right after it cuts a
#     tag, in the SAME run. This is the primary path. It sidesteps GitHub's
#     anti-recursion rule entirely rather than working around it: that rule
#     only blocks a GITHUB_TOKEN-caused event from starting a NEW workflow
#     run. A job called via workflow_call isn't a new run triggered by an
#     event -- it's still the one run that started from the original push to
#     main, so there's nothing for the rule to block. Confirmed by running
#     this demo before the merge: `push: tags:` on this file never fired for
#     a bot-authored tag (release-deploy never ran at all); `workflow_call`
#     from the same run as the tag creation does not have that problem,
#     because it was never a second triggered run to begin with.
#   - `push: tags:` / `workflow_dispatch` stay for the cases workflow_call
#     can't cover: redeploying an OLD tag for rollback (RELEASE_PLAN.md §8.2
#     R2), or a human pushing a tag directly. Both are real actors, not
#     GITHUB_TOKEN, so the anti-recursion rule was never the problem there.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (e.g. for a rollback redeploy of an older tag)'
        required: true
  workflow_call:
    inputs:
      tag:
        description: 'Tag to deploy, passed by release-please.yml'
        required: true
        type: string

concurrency:
  group: release-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve which tag + commit this run targets
        id: resolve
        run: |
          set -euo pipefail
          # `inputs.tag` covers both workflow_call and workflow_dispatch (GitHub
          # unified these two contexts) -- falls through to the pushed tag's own
          # ref_name for the `push: tags:` trigger, where there are no inputs.
          TAG="${{ inputs.tag || github.ref_name }}"
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          SHA=$(git rev-parse "refs/tags/$TAG")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Tag must match pyproject.toml and be reachable from main
        run: |
          git fetch origin main
          bash scripts/guard.sh "${{ steps.resolve.outputs.tag }}" origin/main

  deploy:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: (stub) deploy
        run: |
          echo "deploying ${{ needs.guard.outputs.tag }} -- real repo runs CDK + Copilot here"
          sleep 3
          echo "(stub) deploy finished"

  promote:
    needs: [guard, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward production -> this tag
        run: git push origin "${{ needs.guard.outputs.sha }}:refs/heads/production"
