name: CI

# Required status check on `main` (RELEASE_PLAN.md G3). Standing in for the
# real repo's tests/pylint/bandit/CDK-diff checks — same role, one job.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pytest
      - run: pytest -q
